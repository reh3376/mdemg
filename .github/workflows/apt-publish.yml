name: Publish APT Repository

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.2.17)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish .deb to APT repo
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # Get the tag from the workflow run
            TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name')
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download .deb artifacts from release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p debs
          # Download CLI .deb packages
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.deb" \
            --dir debs || true
          echo "Downloaded .deb files:"
          ls -la debs/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for .deb files
        run: |
          if ! ls debs/*.deb 1>/dev/null 2>&1; then
            echo "::error::No .deb files found in release ${{ steps.tag.outputs.tag }}"
            exit 1
          fi

      - name: Download sidebar .deb (if available)
        continue-on-error: true
        run: |
          # Try to download the sidebar .deb from its repo's latest release
          gh release download \
            --repo reh3376/mdemg-linux-sidebar \
            --pattern "*.deb" \
            --dir debs || echo "No sidebar .deb found (this is OK)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.APT_SIGNING_KEY }}" | base64 -d | gpg --batch --import
          # Trust the key
          KEY_ID=$(gpg --list-secret-keys --keyid-format long 2>/dev/null | grep sec | head -1 | awk '{print $2}' | cut -d/ -f2)
          echo "${KEY_ID}:6:" | gpg --import-ownertrust
          echo "key_id=$KEY_ID" >> "$GITHUB_ENV"

      - name: Build APT repository structure
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          VERSION="${VERSION#v}"

          # Create directory structure
          mkdir -p apt/pool/main/m/mdemg
          mkdir -p apt/pool/main/m/mdemg-sidebar
          mkdir -p apt/dists/stable/main/binary-amd64
          mkdir -p apt/dists/stable/main/binary-arm64

          # Copy .deb files to pool
          for deb in debs/*.deb; do
            BASENAME=$(basename "$deb")
            if echo "$BASENAME" | grep -q "sidebar"; then
              cp "$deb" apt/pool/main/m/mdemg-sidebar/
            else
              cp "$deb" apt/pool/main/m/mdemg/
            fi
          done

          # Generate Packages files
          cd apt
          for arch in amd64 arm64; do
            dpkg-scanpackages --arch "$arch" pool/ > "dists/stable/main/binary-${arch}/Packages"
            gzip -k "dists/stable/main/binary-${arch}/Packages"
          done

          # Generate Release file
          cd dists/stable
          cat > Release <<EOF
          Origin: MDEMG
          Label: MDEMG
          Suite: stable
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: MDEMG APT Repository
          Date: $(date -Ru)
          EOF
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Release

          # Add checksums to Release
          {
            echo "MD5Sum:"
            for f in main/binary-*/Packages main/binary-*/Packages.gz; do
              [ -f "$f" ] || continue
              SIZE=$(stat -c%s "$f")
              MD5=$(md5sum "$f" | awk '{print $1}')
              printf " %s %8d %s\n" "$MD5" "$SIZE" "$f"
            done
            echo "SHA256:"
            for f in main/binary-*/Packages main/binary-*/Packages.gz; do
              [ -f "$f" ] || continue
              SIZE=$(stat -c%s "$f")
              SHA=$(sha256sum "$f" | awk '{print $1}')
              printf " %s %8d %s\n" "$SHA" "$SIZE" "$f"
            done
          } >> Release

          # Sign Release
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release
          gpg --batch --yes --armor --clearsign -o InRelease Release

      - name: Export GPG public key
        run: |
          gpg --armor --export "${{ env.key_id }}" > apt/mdemg-archive-keyring.gpg

      - name: Create setup script
        run: |
          cat > apt/setup.sh << 'SETUP_EOF'
          #!/bin/sh
          set -e
          echo "Adding MDEMG APT repository..."
          curl -fsSL https://reh3376.github.io/apt-mdemg/mdemg-archive-keyring.gpg | \
            sudo gpg --dearmor -o /usr/share/keyrings/mdemg-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/mdemg-archive-keyring.gpg] https://reh3376.github.io/apt-mdemg stable main" | \
            sudo tee /etc/apt/sources.list.d/mdemg.list > /dev/null
          sudo apt update
          echo ""
          echo "MDEMG APT repository added! Install with:"
          echo "  sudo apt install mdemg"
          SETUP_EOF
          chmod +x apt/setup.sh

      - name: Push to APT repository
        run: |
          cd apt
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-dev01-pages
          git add -A
          git commit -m "Update APT repo for ${{ steps.tag.outputs.tag }}"
          git remote add origin "https://x-access-token:${{ secrets.APT_REPO_TOKEN }}@github.com/reh3376/apt-mdemg.git"
          git push -f origin gh-dev01-pages
        env:
          APT_REPO_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
