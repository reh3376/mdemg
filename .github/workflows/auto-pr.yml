name: Auto PR from Dev Branch

# Triggers:
#   - push: primary — fires on every push to a `*_dev*` branch.
#   - workflow_dispatch: fallback — maintainer can trigger manually from
#     the Actions UI or via `gh workflow run auto-pr.yml --ref <branch>`.
#     Added 2026-08-06 after a GitHub Actions push-event delivery incident
#     silently dropped 7 consecutive pushes on reh3376_dev01 (17:30-22:35
#     UTC). Every push registered on the /events API but zero workflow
#     runs were created; CI/branch-naming/docker-publish also affected
#     (all push-triggered workflows on the repo). Manual dispatch uses a
#     different code path and worked while push-event delivery was broken.
#     Resilience improvement, not a workaround: leave both triggers wired
#     even after the push-event issue resolves.
on:
  push:
    branches: ['**_dev*']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create or Update PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for existing PR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr list --head "${{ github.ref_name }}" --base main --state open --json url --jq '.[0].url // empty')
          if [ -n "$PR_URL" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "PR already exists: $PR_URL"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No open PR found, will create one"
          fi

      # A push whose content is identical to main (e.g. a manual post-merge
      # base-sync — see sync-dev-after-merge.yml) must not open an empty PR
      # (failure mode: PR #420). The automated sync pushes with GITHUB_TOKEN
      # and never triggers this workflow; this guard covers manual pushes.
      - name: Skip when branch content matches main
        if: steps.check.outputs.exists == 'false'
        id: diff
        run: |
          if git diff --quiet origin/main HEAD; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "Branch content is identical to main (sync-only push) — skipping PR creation."
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR body from commits
        if: steps.check.outputs.exists == 'false' && steps.diff.outputs.empty == 'false'
        id: body
        # GitHub PR body max = 65,536 chars. A dev branch with hundreds of
        # commits ahead of main (squash merges never advance the merge base,
        # so the log grows) blew past that on 2026-08-07 and failed the run
        # (GraphQL: "Body is too long"). Cap at the most recent 40 commits
        # and add a "…and N more" line if truncated. If 40 headlines ever
        # exceed 65k chars themselves, further capping is fine — the PR
        # body is a courtesy, the git log is the source of truth.
        run: |
          TOTAL=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)
          if [ "$TOTAL" -gt 40 ]; then
            COMMIT_LOG=$(git log origin/main..HEAD --pretty=format:"- %s" --max-count=40)
            REMAINDER=$((TOTAL - 40))
            # shellcheck disable=SC2016 # backticks are literal for markdown output
            COMMIT_LOG=$(printf '%s\n- _(…and %s earlier commits — full log via `git log origin/main..HEAD`)_\n' "$COMMIT_LOG" "$REMAINDER")
          else
            COMMIT_LOG=$(git log origin/main..HEAD --pretty=format:"- %s" 2>/dev/null || echo "- Initial dev branch push")
          fi
          {
            echo "body<<PREOF"
            echo "## Summary"
            echo ""
            echo "Development branch changes from \`${{ github.ref_name }}\`."
            echo ""
            echo "### Commits (most recent ${TOTAL})"
            echo "$COMMIT_LOG"
            echo ""
            echo "---"
            echo "*Auto-generated PR from ${{ github.ref_name }} push*"
            echo "PREOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.check.outputs.exists == 'false' && steps.diff.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ steps.body.outputs.body }}
        run: |
          gh pr create \
            --head "${{ github.ref_name }}" \
            --base main \
            --title "dev: ${{ github.ref_name }} -> main" \
            --body "$PR_BODY"
