name: CI

on:
  push:
    branches: [main, '**_dev*']
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify embedded compose files match source
        run: diff -q docker-compose.yml internal/cli/compose_templates/docker-compose.yml

      - name: Verify embedded launchd templates match source
        run: |
          for f in packaging/launchd/*.plist; do
            base=$(basename "$f")
            diff -q "$f" "internal/cli/launchd_templates/$base"
          done

      - name: Validate schema version consistency
        run: |
          EXPECTED=$(ls migrations/V*.cypher | wc -l | tr -d ' ')
          FAIL=0
          for f in deploy/docker/docker-compose.prod.yml deploy/kubernetes/configmap.yaml .env.example; do
            ACTUAL=$(grep -oP 'REQUIRED_SCHEMA_VERSION[=:]\s*"?\K[0-9]+' "$f" || echo "0")
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "FAIL: $f has REQUIRED_SCHEMA_VERSION=$ACTUAL, expected $EXPECTED"
              FAIL=1
            fi
          done
          HELM_VER=$(grep -oP 'requiredSchemaVersion:\s*"?\K[0-9]+' deploy/helm/mdemg/values.yaml || echo "0")
          if [ "$HELM_VER" != "$EXPECTED" ]; then
            echo "FAIL: deploy/helm/mdemg/values.yaml has requiredSchemaVersion=$HELM_VER, expected $EXPECTED"
            FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then exit 1; fi
          echo "All deploy configs match migration count: $EXPECTED"

      - name: Validate TSDB schema version consistency
        run: |
          EXPECTED=$(ls internal/tsdb/migrations/*.sql | wc -l | tr -d ' ')
          ACTUAL=$(grep -oP 'atoi\("TSDB_REQUIRED_SCHEMA_VERSION",\s*\K[0-9]+' internal/config/config.go || echo "0")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: config.go TSDB_REQUIRED_SCHEMA_VERSION default=$ACTUAL, expected $EXPECTED"
            exit 1
          fi
          echo "TSDB schema version consistent: $EXPECTED"

      - name: Build unified CLI
        run: |
          go build -v \
            -ldflags "-X mdemg/internal/cli.Version=ci -X mdemg/internal/cli.Commit=$(git rev-parse --short HEAD) -X mdemg/internal/cli.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o bin/mdemg ./cmd/mdemg

      - name: Build legacy binaries
        run: |
          go build -v -o bin/mdemg-server ./cmd/server
          go build -v -o bin/ingest-codebase ./cmd/ingest-codebase
          go build -v -o bin/mdemg-mcp ./cmd/mcp-server

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
    env:
      TEST_NEO4J_URI: bolt://localhost:7687
      TEST_NEO4J_USER: neo4j
      TEST_NEO4J_PASS: testpassword
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Unit Tests
        run: go test -race -v -coverprofile=coverage.out ./internal/...

      - name: Wait for Neo4j
        run: |
          timeout 60s bash -c 'until curl -s http://localhost:7687 > /dev/null; do sleep 2; done' || true
          # Note: Neo4j bolt port doesn't respond to HTTP, but we can check if it is open
          timeout 60s bash -c 'until printf "" 2>>/dev/null >/dev/tcp/localhost/7687; do sleep 2; done'
          # Additional wait for Neo4j to fully initialize
          sleep 5

      - name: Build unified CLI
        run: |
          go build \
            -ldflags "-X mdemg/internal/cli.Version=ci -X mdemg/internal/cli.Commit=$(git rev-parse --short HEAD) -X mdemg/internal/cli.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o bin/mdemg ./cmd/mdemg

      - name: Run Sidecar Unit Tests
        run: go test -v ./internal/sidecar/... ./internal/cli/... -run "TestExtractPort|TestDoctorStatus|TestDoctorNext|TestRunConfig|TestGenerate|TestBuildHealth|TestIsEmpty"

      - name: Run Obsidian Module Unit Tests
        run: go test -v ./plugins/obsidian-module/...

      - name: Run Sidecar Integration Tests
        run: go test -v -tags=integration ./tests/integration/... -run "TestSidecar_" -timeout 120s
        env:
          MDEMG_BINARY: ${{ github.workspace }}/bin/mdemg

      - name: Validate sidecar schemas
        run: pip install jsonschema && python3 scripts/verify_sidecar_schemas.py

      - name: Run sidecar acceptance test
        run: bash scripts/sidecar-acceptance.sh --binary ${{ github.workspace }}/bin/mdemg

      - name: Apply Neo4j migrations
        run: |
          export NEO4J_URI=bolt://localhost:7687
          export NEO4J_USER=neo4j
          export NEO4J_PASS=testpassword
          ./bin/mdemg db migrate

      - name: Start MDEMG server
        run: |
          export NEO4J_URI=bolt://localhost:7687
          export NEO4J_USER=neo4j
          export NEO4J_PASS=testpassword
          export LISTEN_ADDR=:9999
          export PORT_RANGE_START=10000
          export PORT_RANGE_END=10099
          export PORT_FILE_PATH=.mdemg.port
          export EMBEDDING_PROVIDER=stub
          export BACKUP_ENABLED=true
          export BACKUP_STORAGE_DIR=/tmp/mdemg-backups
          export METALEARN_ENABLED=true
          export METALEARN_GLOBAL_SPACE_ID=mdemg-global
          # Phase 11.6.3.1 + 13.5: framework requires a healthy LLM endpoint at
          # startup (preflight probes EffectiveLLMEndpoint() + /models). CI has no
          # LLM backend running and LLM_ENDPOINT defaults to api.openai.com which
          # 401s. Bypass with MDEMG_ALLOW_NO_MLX=1 — integration tests don't
          # exercise LLM call sites. Disable watchdog too so its background prober
          # doesn't churn against the absent endpoint.
          export MDEMG_ALLOW_NO_MLX=1
          export MLX_WATCHDOG_ENABLED=false
          # Phase 13.1: column voting default-flipped to true in production. The
          # integration test suite (TestScoringComponentBreakdown,
          # TestGraphExpansion) asserts on legacy linear scorer specifics — exact
          # weight formula and per-result Activation field semantics. Opt those
          # tests back into legacy linear here. Operators get the new default in
          # production; the test suite continues to validate the linear scorer
          # specifically since RRF has its own dedicated unit tests.
          export RETRIEVAL_COLUMN_VOTING_ENABLED=false
          mkdir -p /tmp/mdemg-backups
          ./bin/mdemg serve &

          # Wait for port file (server writes it after binding)
          timeout 30s bash -c 'until [ -f .mdemg.port ]; do sleep 1; done'
          MDEMG_PORT=$(cat .mdemg.port)
          echo "MDEMG_PORT=$MDEMG_PORT" >> "$GITHUB_ENV"
          echo "MDEMG server is ready on port $MDEMG_PORT"

      - name: Run Integration Tests
        run: go test -v -tags=integration ./tests/integration/...
        env:
          TEST_MDEMG_ENDPOINT: http://localhost:${{ env.MDEMG_PORT }}
          MDEMG_BINARY: ${{ github.workspace }}/bin/mdemg

      - name: Setup Python for UATS
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install UATS dependencies
        run: pip install requests jsonpath-ng

      - name: Create UATS test fixtures
        run: |
          mkdir -p /tmp/uats-test-codebase
          echo 'package main' > /tmp/uats-test-codebase/main.go

      - name: Run UATS Contract Tests
        run: |
          python3 docs/api/api-spec/uats/runners/uats_runner.py validate-all \
            --spec-dir docs/api/api-spec/uats/specs/ \
            --base-url http://localhost:${{ env.MDEMG_PORT }} \
            --exclude-tag unts,llm_required,j17_disabled,jiminy_disabled,sidecar_required,constraint_scope_required,tsdb

      - name: Run UBTS Smoke Benchmark (soft-fail)
        continue-on-error: true
        run: |
          python3 docs/tests/ubts/runners/ubts_runner.py \
            --spec docs/tests/ubts/specs/retrieve_latency.ubts.json \
            --profile docs/tests/ubts/profiles/smoke.profile.json \
            --base-url http://localhost:${{ env.MDEMG_PORT }} \
            --output /tmp/ubts-results/

      - name: Run UNTS Hash Verification (merge-blocking)
        run: |
          python3 docs/api/api-spec/uats/runners/uats_runner.py verify-hashes \
            --spec-dir docs/api/api-spec/uats/specs/

      - name: Run USTS Security Tests (merge-blocking)
        run: |
          python3 docs/tests/usts/runners/usts_runner.py \
            --spec "docs/tests/usts/specs/*.usts.json" \
            --base-url http://localhost:${{ env.MDEMG_PORT }}

      - name: Run UOBS Observability Tests (soft-fail)
        continue-on-error: true
        run: |
          python3 docs/tests/uobs/runners/uobs_runner.py \
            --spec "docs/tests/uobs/specs/*.uobs.json" \
            --base-url http://localhost:${{ env.MDEMG_PORT }}

      - name: Run UOTS Observability Artifact Tests (soft-fail)
        continue-on-error: true
        run: |
          python3 docs/api/api-spec/uots/runners/uots_runner.py \
            --spec-dir docs/api/api-spec/uots/specs/ \
            --base-url http://localhost:${{ env.MDEMG_PORT }}

      - name: Run UETS Emergence Evaluation (soft-fail)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python3 docs/tests/uets/runners/uets_runner.py validate-all \
            --spec-dir docs/tests/uets/specs/ \
            --no-llm

      - name: Run UVTS Semantic Validation (soft-fail)
        continue-on-error: true
        run: |
          python3 docs/tests/uvts/runners/uvts_runner.py \
            --spec docs/tests/uvts/specs/lnl_demo_validation.uvts.json \
            --base-url http://localhost:${{ env.MDEMG_PORT }} \
            --profile quick

      - name: Run UAMS Auth Method Validation (soft-fail)
        continue-on-error: true
        run: |
          python3 docs/tests/uams/runners/uams_runner.py validate-all \
            --spec-dir docs/tests/uams/specs/

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Run gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
