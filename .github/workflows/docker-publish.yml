name: Docker Publish

on:
  push:
    # RELEASE-HYGIENE-001 E1: tag triggers publish semver-tagged images
    # directly (workflow_run:[Release] chain hasn't fired in visible
    # history — kept as backup). tag pushes DO NOT filter on paths;
    # every release must produce a docker image.
    tags: ["v*"]
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "plugins/**"
      - "go.mod"
      - "go.sum"
      - "deploy/docker/Dockerfile.prod"
      - "docker-compose.yml"
      - "neural/**"
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC — catches missed triggers

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The job builds TWO multi-arch images (amd64 + QEMU arm64) with
      # mode=max gha cache on one runner; the sidecar's torch wheels pushed
      # the ~14 GB free disk over the edge intermittently ("No space left on
      # device" killed the runner worker mid-sidecar-build — runs 27366931196,
      # 27367756926, 27377325965). Reclaim ~25-30 GB of preinstalled
      # toolchains we never use before building.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost || true
          df -h /

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # DOCKER-TAG-PREFIX-001 (2026-08-07): a `pattern=v{{version}}`
          # semver rule silently drops the literal `v` on prerelease tags
          # (v6 behavior — v0.11.0-beta.2 → :0.11.0-beta.2, no v-prefix).
          # Emit BOTH forms via {{raw}} + {{version}} so any consumer
          # reference (:v0.11.0-beta.2 OR :0.11.0-beta.2) resolves.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push MDEMG server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract neural-sidecar metadata
        id: meta-neural
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-neural-sidecar
          # DOCKER-TAG-PREFIX-001 — see main-image metadata step for the
          # `v{{version}}` prerelease-normalization gotcha.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push neural-sidecar
        uses: docker/build-push-action@v7
        with:
          context: ./neural
          file: ./neural/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-neural.outputs.tags }}
          labels: ${{ steps.meta-neural.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
