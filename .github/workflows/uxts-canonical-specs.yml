name: UXTS Canonical Specs

on:
  push:
    branches: [main]
    paths:
      - 'docs/api/api-spec/**'
      - 'docs/tests/**'
      - 'docs/lang-parser/**'
      - 'docs/development/UXTS_FRAMEWORK_MATRIX.md'
      - 'scripts/verify_uxts_*.py'
      - '.github/workflows/uxts-canonical-specs.yml'
      - 'Makefile'
  pull_request:
    branches: [main]
    paths:
      - 'docs/api/api-spec/**'
      - 'docs/tests/**'
      - 'docs/lang-parser/**'
      - 'docs/development/UXTS_FRAMEWORK_MATRIX.md'
      - 'scripts/verify_uxts_*.py'
      - '.github/workflows/uxts-canonical-specs.yml'
      - 'Makefile'

# Minimum GITHUB_TOKEN scope: `contents: read` covers actions/checkout;
# UXTS verifiers run read-only against the repo (scripts/verify_uxts_*.py
# + UATS/USTS/UOTS/UOBS contract checks).
# CodeQL: actions/missing-workflow-permissions.
permissions:
  contents: read

jobs:
  canonical-spec-verification:
    name: Verify Canonical UDTS/UVTS Specs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify canonical UxTS specs
        run: python3 scripts/verify_uxts_canonical_specs.py

      - name: Check UxTS framework drift (merge-blocking)
        # UXTS-CI-001: was a continue-on-error zombie while the matrix
        # went 51 days stale (UATS off by +96 specs). The checker now
        # covers all 15 frameworks and the matrix is refreshed — drift
        # blocks until the matrix is updated alongside new specs.
        run: python3 scripts/verify_uxts_drift.py
