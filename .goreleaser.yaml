# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - id: mdemg-darwin-arm64
    main: ./cmd/mdemg
    binary: mdemg
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X mdemg/internal/cli.Version={{.Version}}
      - -X mdemg/internal/cli.Commit={{.ShortCommit}}
      - -X mdemg/internal/cli.BuildDate={{.Date}}

  - id: mdemg-darwin-amd64
    main: ./cmd/mdemg
    binary: mdemg
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X mdemg/internal/cli.Version={{.Version}}
      - -X mdemg/internal/cli.Commit={{.ShortCommit}}
      - -X mdemg/internal/cli.BuildDate={{.Date}}

  - id: mdemg-linux-amd64
    main: ./cmd/mdemg
    binary: mdemg
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-linux-gnu
      - CXX=zig c++ -target x86_64-linux-gnu
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X mdemg/internal/cli.Version={{.Version}}
      - -X mdemg/internal/cli.Commit={{.ShortCommit}}
      - -X mdemg/internal/cli.BuildDate={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "mdemg_{{.Version}}_{{.Os}}_{{.Arch}}"
    files:
      - src: "man/man1/*.1"
        dst: man/man1
        strip_parent: true

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: reh3376
      name: homebrew-mdemg
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: mdemg
    homepage: "https://github.com/reh3376/mdemg"
    description: "Multi-Dimensional Emergent Memory Graph — cognitive substrate for AI agents"
    dependencies:
      - name: docker
        type: optional
    install: |
      bin.install "mdemg"
      man1.install Dir["man/man1/*.1"]
    test: |
      system "#{bin}/mdemg", "version"
