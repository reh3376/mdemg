# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - id: mdemg-darwin-arm64
    main: ./cmd/mdemg
    binary: mdemg
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X mdemg/internal/cli.Version={{.Version}}
      - -X mdemg/internal/cli.Commit={{.ShortCommit}}
      - -X mdemg/internal/cli.BuildDate={{.Date}}

  - id: mdemg-darwin-amd64
    main: ./cmd/mdemg
    binary: mdemg
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X mdemg/internal/cli.Version={{.Version}}
      - -X mdemg/internal/cli.Commit={{.ShortCommit}}
      - -X mdemg/internal/cli.BuildDate={{.Date}}

  # UxTS plugin — REASONING module for test coverage awareness
  - id: uxts-module-darwin-arm64
    main: ./plugins/uxts-module
    binary: uxts-module
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w

  - id: uxts-module-darwin-amd64
    main: ./plugins/uxts-module
    binary: uxts-module
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - -s -w

  # Linux builds via zig cross-compiler (tree-sitter vendors C code, no system deps)
  - id: mdemg-linux-amd64
    main: ./cmd/mdemg
    binary: mdemg
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-linux-gnu
      - CXX=zig c++ -target x86_64-linux-gnu
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X mdemg/internal/cli.Version={{.Version}}
      - -X mdemg/internal/cli.Commit={{.ShortCommit}}
      - -X mdemg/internal/cli.BuildDate={{.Date}}

  - id: mdemg-linux-arm64
    main: ./cmd/mdemg
    binary: mdemg
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-linux-gnu
      - CXX=zig c++ -target aarch64-linux-gnu
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X mdemg/internal/cli.Version={{.Version}}
      - -X mdemg/internal/cli.Commit={{.ShortCommit}}
      - -X mdemg/internal/cli.BuildDate={{.Date}}

  - id: uxts-module-linux-amd64
    main: ./plugins/uxts-module
    binary: uxts-module
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w

  - id: uxts-module-linux-arm64
    main: ./plugins/uxts-module
    binary: uxts-module
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "mdemg_{{.Version}}_{{.Os}}_{{.Arch}}"
    files:
      - src: "man/man1/*.1"
        dst: man/man1
        strip_parent: true
      - src: "plugins/uxts-module/manifest.json"
        dst: plugins/uxts-module
        strip_parent: true
      - src: "packaging/mdemg_linux/systemd/*"
        dst: systemd
        strip_parent: true

nfpms:
  - id: mdemg-deb
    package_name: mdemg
    file_name_template: "mdemg_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - mdemg-linux-amd64
      - mdemg-linux-arm64
    vendor: reh3376
    homepage: https://github.com/reh3376/mdemg
    maintainer: "reh3376 <reh3376@users.noreply.github.com>"
    description: "Multi-Dimensional Emergent Memory Graph — cognitive substrate for AI agents"
    license: MIT
    formats:
      - deb
    dependencies:
      - curl
      - tar
    recommends:
      - docker.io | docker-ce
    suggests:
      - jq
    section: devel
    priority: optional
    contents:
      - src: man/man1/*.1
        dst: /usr/share/man/man1/
      - src: plugins/uxts-module/manifest.json
        dst: /usr/share/mdemg/plugins/uxts-module/manifest.json
      - src: packaging/mdemg_linux/systemd/mdemg.service
        dst: /usr/lib/systemd/system/mdemg@.service
      - src: packaging/mdemg_linux/systemd/mdemg-rsic.service
        dst: /usr/lib/systemd/system/mdemg-rsic@.service
      - src: packaging/mdemg_linux/systemd/mdemg-rsic.timer
        dst: /usr/lib/systemd/system/mdemg-rsic@.timer
    scripts:
      postinstall: packaging/mdemg_linux/scripts/postinst.sh
      preremove: packaging/mdemg_linux/scripts/prerm.sh
      postremove: packaging/mdemg_linux/scripts/postrm.sh

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: reh3376
      name: homebrew-mdemg
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: mdemg
    homepage: "https://github.com/reh3376/mdemg"
    description: "Multi-Dimensional Emergent Memory Graph — cognitive substrate for AI agents"
    dependencies:
      - name: docker
        type: optional
    install: |
      bin.install "mdemg"
      man1.install Dir["man/man1/*.1"]
      # UxTS plugin (default-enabled REASONING module)
      plugdir = share/"mdemg/plugins/uxts-module"
      plugdir.install "uxts-module"
      plugdir.install "plugins/uxts-module/manifest.json"
    test: |
      system "#{bin}/mdemg", "version"
    caveats: |
      Jiminy inner-voice guidance is configured during 'mdemg init'.
      Default model: gpt-5.4-nano (OpenAI) or qwen3:8b (Ollama).
      Run 'mdemg init' in your project directory to get started.
