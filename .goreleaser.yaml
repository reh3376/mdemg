# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - id: mdemg-darwin-arm64
    main: ./cmd/mdemg
    binary: mdemg
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X mdemg/internal/cli.Version={{.Version}}
      - -X mdemg/internal/cli.Commit={{.ShortCommit}}
      - -X mdemg/internal/cli.BuildDate={{.Date}}

  - id: mdemg-darwin-amd64
    main: ./cmd/mdemg
    binary: mdemg
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X mdemg/internal/cli.Version={{.Version}}
      - -X mdemg/internal/cli.Commit={{.ShortCommit}}
      - -X mdemg/internal/cli.BuildDate={{.Date}}

  # UxTS plugin — REASONING module for test coverage awareness
  - id: uxts-module-darwin-arm64
    main: ./plugins/uxts-module
    binary: uxts-module
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w

  - id: uxts-module-darwin-amd64
    main: ./plugins/uxts-module
    binary: uxts-module
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - -s -w

  # Linux builds via zig cross-compiler (tree-sitter vendors C code, no system deps)
  - id: mdemg-linux-amd64
    main: ./cmd/mdemg
    binary: mdemg
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-linux-gnu
      - CXX=zig c++ -target x86_64-linux-gnu
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X mdemg/internal/cli.Version={{.Version}}
      - -X mdemg/internal/cli.Commit={{.ShortCommit}}
      - -X mdemg/internal/cli.BuildDate={{.Date}}

  - id: mdemg-linux-arm64
    main: ./cmd/mdemg
    binary: mdemg
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-linux-gnu
      - CXX=zig c++ -target aarch64-linux-gnu
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X mdemg/internal/cli.Version={{.Version}}
      - -X mdemg/internal/cli.Commit={{.ShortCommit}}
      - -X mdemg/internal/cli.BuildDate={{.Date}}

  - id: uxts-module-linux-amd64
    main: ./plugins/uxts-module
    binary: uxts-module
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w

  - id: uxts-module-linux-arm64
    main: ./plugins/uxts-module
    binary: uxts-module
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w

  # Obsidian ingestion module (INGESTION plugin for Obsidian vault parsing)
  - id: obsidian-module-darwin-arm64
    main: ./plugins/obsidian-module
    binary: obsidian-module
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w

  - id: obsidian-module-darwin-amd64
    main: ./plugins/obsidian-module
    binary: obsidian-module
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - -s -w

  - id: obsidian-module-linux-amd64
    main: ./plugins/obsidian-module
    binary: obsidian-module
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w

  - id: obsidian-module-linux-arm64
    main: ./plugins/obsidian-module
    binary: obsidian-module
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w

archives:
  - id: darwin
    formats:
      - tar.gz
    builds:
      - mdemg-darwin-arm64
      - mdemg-darwin-amd64
      - uxts-module-darwin-arm64
      - uxts-module-darwin-amd64
      - obsidian-module-darwin-arm64
      - obsidian-module-darwin-amd64
    name_template: "mdemg_{{.Version}}_{{.Os}}_{{.Arch}}"
    files:
      - src: "man/man1/*.1"
        dst: man/man1
        strip_parent: true
      - src: "plugins/uxts-module/manifest.json"
        dst: plugins/uxts-module
        strip_parent: true
      - src: "plugins/obsidian-module/manifest.json"
        dst: plugins/obsidian-module
        strip_parent: true
      - src: "docker-compose.yml"
        dst: .
        strip_parent: true
  - id: linux
    formats:
      - tar.gz
    builds:
      - mdemg-linux-amd64
      - mdemg-linux-arm64
      - uxts-module-linux-amd64
      - uxts-module-linux-arm64
      - obsidian-module-linux-amd64
      - obsidian-module-linux-arm64
    name_template: "mdemg_{{.Version}}_{{.Os}}_{{.Arch}}"
    files:
      - src: "man/man1/*.1"
        dst: man/man1
        strip_parent: true
      - src: "plugins/uxts-module/manifest.json"
        dst: plugins/uxts-module
        strip_parent: true
      - src: "plugins/obsidian-module/manifest.json"
        dst: plugins/obsidian-module
        strip_parent: true
      - src: "docker-compose.yml"
        dst: .
        strip_parent: true

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: reh3376
      name: homebrew-mdemg
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: mdemg
    homepage: "https://github.com/reh3376/mdemg"
    description: "Multi-Dimensional Emergent Memory Graph — cognitive substrate for AI agents"
    dependencies:
      - name: docker
        type: optional
    install: |
      bin.install "mdemg"
      man1.install Dir["man/man1/*.1"]
      # UxTS plugin (default-enabled REASONING module)
      plugdir = share/"mdemg/plugins/uxts-module"
      plugdir.install "uxts-module"
      plugdir.install "plugins/uxts-module/manifest.json"
      # Obsidian plugin (INGESTION module for Obsidian vault parsing)
      obsdir = share/"mdemg/plugins/obsidian-module"
      obsdir.install "obsidian-module"
      obsdir.install "plugins/obsidian-module/manifest.json"
      # Docker Compose file (embedded in binary, also available for inspection)
      share.install "docker-compose.yml" => "mdemg/docker-compose.yml"
    post_install: |
      # Runs on both install and upgrade. On fresh install, no Docker instances
      # exist, so upgradeDockerInstances returns silently (< 200ms overhead).
      system bin/"mdemg", "upgrade", "--docker-only"
    test: |
      system "#{bin}/mdemg", "version"
    caveats: |
      Docker is required for running MDEMG services.
      After 'brew upgrade mdemg', running Docker instances are updated automatically.
      Jiminy inner-voice guidance is configured during 'mdemg init'.
      Default model: gpt-5.4-nano (OpenAI) or qwen3:8b (Ollama).
      Run 'mdemg init' in your project directory to get started.
