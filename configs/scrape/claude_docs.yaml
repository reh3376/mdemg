# CLAUDE-DOCS-TRAINING-001 Epic 1/2 — scrape configuration for Claude Code docs.
# Produced 2026-08-14 during Epic 1 discovery.
#
# Robots.txt verdicts (fetched 2026-08-14):
#   code.claude.com/robots.txt:
#     User-agent: *
#     Content-Signal: ai-train=yes, search=yes, ai-input=yes    # ← explicit AI-training permission
#     Disallow: /cdn-cgi/
#     Disallow: /_next/  (Allow: /_next/image)
#     Sitemap: https://code.claude.com/docs/sitemap.xml
#   platform.claude.com/robots.txt:
#     User-agent: *
#     Disallow: /api/                                            # ← Messages API reference BLOCKED
#     Sitemap: https://platform.claude.com/sitemap.xml
#
# Source of truth: code.claude.com/docs/llms.txt (Anthropic's own curated
# training-ready index of ~200 URLs, organized by section). Each URL has a
# `.md` variant that serves the raw markdown — no HTML parsing needed.
#
# Included sections (150 URLs, ~60% of the 247 total):
#   Core Documentation, Features & Extension, Configuration & Customization,
#   Reference (CLI, commands, env-vars, hooks, settings, tools-reference),
#   Multi-Agent & Orchestration, MCP & Extensions, Agent SDK,
#   Output & Collaboration, Programmatic Access, Model & Performance,
#   Platforms & Integrations (VS Code, JetBrains, Chrome, GitHub Actions, Slack)
#
# Excluded sections (~50 URLs — low ROI for CLI-user knowledge target):
#   /whats-new/*                    — weekly changelogs, churn-heavy + redundant
#   /claude-apps-gateway-*          — enterprise gateway deployment
#   /self-hosted-environments-*     — enterprise self-hosting
#   /amazon-bedrock, /google-vertex-ai, /microsoft-foundry  — cloud-provider hosting
#   /llm-gateway-*                  — LLM gateway config
#   /communications-kit, /champion-kit — rollout/adoption
#
# Rate limit: 1s between fetches (respects code.claude.com informal norm).
# User-Agent: identifies as MDEMG training scraper — not spoofing a browser.

domain: code.claude.com
scheme: https
rate_limit_seconds: 1.0
timeout_seconds: 30
user_agent: "MDEMG-Docs-Trainer/1.0 (CLAUDE-DOCS-TRAINING-001; mdemg contact via github.com/reh3376/mdemg/issues)"
output_dir: training_data/claude-docs/raw
manifest_path: training_data/claude-docs/scrape_manifest.json

# URL paths (relative to https://code.claude.com). The scraper fetches each
# path + ".md" — code.claude.com serves the underlying markdown source at that
# URL, avoiding HTML parsing entirely.
