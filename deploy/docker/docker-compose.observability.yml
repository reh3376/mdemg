# Observability Stack for Local Development
# Usage: docker compose -f docker-compose.observability.yml up -d
# Assumes MDEMG API is running on host at localhost:9999

version: "3.8"

services:
  grafana:
    image: grafana/grafana:10.2.2
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/dashboards/mdemg-overview.json"
      GF_INSTALL_PLUGINS: "kniepdennis-neo4j-datasource,hamedkarbasi93-nodegraphapi-datasource"
      TSDB_PASSWORD: "${TSDB_PASSWORD:-mdemg_metrics}"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - timescaledb

  timescaledb:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    ports:
      - "${TSDB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: mdemg
      POSTGRES_PASSWORD: ${TSDB_PASSWORD:-mdemg_metrics}
      POSTGRES_DB: mdemg_metrics
    volumes:
      - tsdb_data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdemg -d mdemg_metrics"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  grafana-data:
  tsdb_data:
