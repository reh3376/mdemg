version: "3.8"

services:
  mdemg:
    image: mdemg:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Core settings
      LISTEN_ADDR: ":8080"
      LOG_FORMAT: "json"
      LOG_SKIP_HEALTH: "true"

      # Neo4j connection
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASS: "${NEO4J_PASSWORD}"
      NEO4J_MAX_POOL_SIZE: "100"
      REQUIRED_SCHEMA_VERSION: "24"

      # Embedding provider
      EMBEDDING_PROVIDER: "openai"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"

      # Rate limiting
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_RPS: "100"
      RATE_LIMIT_BURST: "200"

      # Circuit breaker
      CIRCUIT_BREAKER_ENABLED: "true"
      CIRCUIT_BREAKER_THRESHOLD: "5"
      CIRCUIT_BREAKER_TIMEOUT: "30"

      # Authentication (enable in production)
      AUTH_ENABLED: "true"
      AUTH_MODE: "apikey"
      AUTH_API_KEYS: "${MDEMG_API_KEYS}"

      # Metrics
      METRICS_ENABLED: "true"
      METRICS_NAMESPACE: "mdemg"

      # Neural sidecar (J17 protocol)
      J17_SIDECAR_URL: "${J17_SIDECAR_URL:-http://neural-sidecar:8000}"
      J17_SIDECAR_MODE: "${J17_SIDECAR_MODE:-shadow}"
      J17_SIDECAR_TIMEOUT_MS: "${J17_SIDECAR_TIMEOUT_MS:-1000}"
      J17_SIDECAR_CONFIDENCE_FLOOR: "${J17_SIDECAR_CONFIDENCE_FLOOR:-0.6}"
      J17_SIDECAR_CB_FAILURE_THRESHOLD: "${J17_SIDECAR_CB_FAILURE_THRESHOLD:-3}"
      J17_SIDECAR_CB_TIMEOUT_SEC: "${J17_SIDECAR_CB_TIMEOUT_SEC:-15}"
      J17_NLI_COMPREHENSION_ENABLED: "${J17_NLI_COMPREHENSION_ENABLED:-false}"
      J17_NLI_CALIBRATION_BIAS_THRESHOLD: "${J17_NLI_CALIBRATION_BIAS_THRESHOLD:-0.15}"

      # RSIC overall-health weights (DH-005). Hybrid reliability × user-impact
      # priors. Formula normalises — values need not sum to 1.0. Zero disables
      # a dimension. See docs/features/rsic-feedback-loop.md for derivation.
      RSIC_HEALTH_WEIGHT_RETRIEVAL: "${RSIC_HEALTH_WEIGHT_RETRIEVAL:-0.08}"
      RSIC_HEALTH_WEIGHT_MEMORY: "${RSIC_HEALTH_WEIGHT_MEMORY:-0.15}"
      RSIC_HEALTH_WEIGHT_EDGE: "${RSIC_HEALTH_WEIGHT_EDGE:-0.15}"
      RSIC_HEALTH_WEIGHT_TASK: "${RSIC_HEALTH_WEIGHT_TASK:-0.20}"
      RSIC_HEALTH_WEIGHT_GUIDANCE: "${RSIC_HEALTH_WEIGHT_GUIDANCE:-0.17}"
      RSIC_HEALTH_WEIGHT_PROTOCOL: "${RSIC_HEALTH_WEIGHT_PROTOCOL:-0.20}"
      RSIC_HEALTH_WEIGHT_SYNERGY: "${RSIC_HEALTH_WEIGHT_SYNERGY:-0.05}"

      # Graceful shutdown
      GRACEFUL_SHUTDOWN_TIMEOUT: "30"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      neo4j:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      neural-sidecar:
        condition: service_healthy
    networks:
      - mdemg-net
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  neo4j:
    image: neo4j:5.15-enterprise
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: "1G"
      NEO4J_dbms_memory_heap_max__size: "2G"
      NEO4J_dbms_memory_pagecache_size: "1G"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mdemg-net
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

  timescaledb:
    image: timescale/timescaledb:2.25.1-pg16
    restart: unless-stopped
    ports:
      - "${TSDB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: mdemg_metrics
      POSTGRES_USER: mdemg
      POSTGRES_PASSWORD: ${TSDB_PASSWORD:-mdemg_metrics}
    volumes:
      - tsdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdemg -d mdemg_metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mdemg-net

  neural-sidecar:
    build:
      context: ../..
      dockerfile: neural/Dockerfile
    restart: unless-stopped
    ports:
      - "${SIDECAR_PORT:-8100}:8000"
    environment:
      NEURAL_RERANK_MODEL: ${NEURAL_RERANK_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      NEURAL_NLI_MODEL: ${NEURAL_NLI_MODEL:-cross-encoder/nli-MiniLM2-L6-H768}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mdemg-net
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  grafana:
    image: grafana/grafana:10.2.2
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/dashboards/mdemg-overview.json"
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      GF_INSTALL_PLUGINS: "kniepdennis-neo4j-datasource,hamedkarbasi93-nodegraphapi-datasource"
      TSDB_PASSWORD: "${TSDB_PASSWORD:-mdemg_metrics}"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - mdemg-net
    depends_on:
      - timescaledb

volumes:
  neo4j-data:
  neo4j-logs:
  tsdb_data:
  grafana-data:

networks:
  mdemg-net:
    driver: bridge
