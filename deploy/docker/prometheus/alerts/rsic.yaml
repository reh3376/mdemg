# MDEMG RSIC (Recursive Self-Improvement Cycle) Alerting Rules
# Phase 91: Observability & Operations

groups:
  - name: mdemg_rsic
    interval: 60s
    rules:
      # High cycle failure rate — too many cycles not completing successfully
      - alert: MDEMGRSICHighFailureRate
        expr: |
          (
            sum(rate(mdemg_rsic_cycle_total{outcome=~"error|low_confidence"}[10m]))
            /
            sum(rate(mdemg_rsic_cycle_total{outcome="started"}[10m]))
          ) > 0.25
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "RSIC cycle failure rate exceeds 25%"
          description: "{{ $value | printf \"%.0f\" }}% of RSIC cycles are failing (errors or low confidence). Check Neo4j health and assessment confidence thresholds."

      # Repeated watchdog force triggers — system unable to self-maintain
      - alert: MDEMGRSICRepeatedForceTriggers
        expr: rate(mdemg_rsic_watchdog_force_total[1h]) > 0.5
        for: 30m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "RSIC watchdog repeatedly force-triggering cycles"
          description: "Watchdog force triggers at {{ $value | printf \"%.2f\" }}/hr. This indicates cycles are not completing or decay is too aggressive. Check meso period and watchdog thresholds."

      # High trigger rejection rate — most triggers being blocked
      - alert: MDEMGRSICHighRejectionRate
        expr: |
          (
            sum(rate(mdemg_rsic_trigger_rejected_total[15m]))
            /
            (sum(rate(mdemg_rsic_trigger_rejected_total[15m])) + sum(rate(mdemg_rsic_cycle_total{outcome="started"}[15m])))
          ) > 0.5
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "RSIC trigger rejection rate exceeds 50%"
          description: "{{ $value | printf \"%.0f\" }}% of RSIC triggers are being rejected. Check cooldown/dedupe settings and active cycle overlap."

      # Per-action failure spike — a specific action type is failing repeatedly
      - alert: MDEMGRSICActionFailureSpike
        expr: |
          (
            sum by (action) (rate(mdemg_rsic_action_total{status="failed"}[10m]))
            /
            sum by (action) (rate(mdemg_rsic_action_total{status="dispatched"}[10m]))
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "RSIC action {{ $labels.action }} failure rate exceeds 50%"
          description: "Action {{ $labels.action }} is failing at {{ $value | printf \"%.0f\" }}% rate. Run a dry-run cycle to diagnose."

      # Safety rejection spike — safety validator blocking too many actions
      - alert: MDEMGRSICSafetyRejectionSpike
        expr: sum(rate(mdemg_rsic_safety_blocked_total[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "RSIC safety blocking actions at elevated rate"
          description: "Safety validator blocking {{ $value | printf \"%.2f\" }} actions/min. Review blast-radius limits and protected-space configuration."

      # Low calibration confidence — an action type has poor success history
      - alert: MDEMGRSICLowConfidence
        expr: mdemg_rsic_calibration_confidence < 0.3
        for: 30m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "RSIC calibration confidence low for action {{ $labels.action }}"
          description: "Action {{ $labels.action }} confidence is {{ $value | printf \"%.2f\" }} (threshold: 0.3). Consider disabling this action type or investigating failures."

      # High watchdog decay score — system hasn't cycled recently
      - alert: MDEMGRSICHighDecayScore
        expr: mdemg_rsic_watchdog_decay_score > 8.0
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "RSIC watchdog decay score high for space {{ $labels.space_id }}"
          description: "Decay score is {{ $value | printf \"%.1f\" }} for space {{ $labels.space_id }}. System may not be cycling frequently enough."

      # Cycle duration spike — cycles taking unusually long
      - alert: MDEMGRSICCycleDurationSpike
        expr: histogram_quantile(0.95, sum by (le, tier) (rate(mdemg_rsic_cycle_duration_seconds_bucket[30m]))) > 300
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "RSIC cycle p95 duration exceeds 5 minutes (tier={{ $labels.tier }})"
          description: "p95 cycle duration is {{ $value | printf \"%.0f\" }}s for tier {{ $labels.tier }}. Check Neo4j performance and action execution times."
