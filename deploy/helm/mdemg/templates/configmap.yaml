apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mdemg.fullname" . }}-config
  labels:
    {{- include "mdemg.labels" . | nindent 4 }}
data:
  # Schema version
  REQUIRED_SCHEMA_VERSION: {{ .Values.config.requiredSchemaVersion | quote }}

  # Embedding provider
  EMBEDDING_PROVIDER: {{ .Values.config.embeddingProvider | quote }}
  EMBEDDING_CACHE_ENABLED: {{ .Values.config.embeddingCacheEnabled | quote }}
  EMBEDDING_CACHE_SIZE: {{ .Values.config.embeddingCacheSize | quote }}

  # Query cache
  QUERY_CACHE_ENABLED: {{ .Values.config.queryCacheEnabled | quote }}
  QUERY_CACHE_CAPACITY: {{ .Values.config.queryCacheCapacity | quote }}
  QUERY_CACHE_TTL_SECONDS: {{ .Values.config.queryCacheTTLSeconds | quote }}

  # Rate limiting
  RATE_LIMIT_ENABLED: {{ .Values.config.rateLimitEnabled | quote }}
  RATE_LIMIT_RPS: {{ .Values.config.rateLimitRPS | quote }}
  RATE_LIMIT_BURST: {{ .Values.config.rateLimitBurst | quote }}
  RATE_LIMIT_BY_IP: {{ .Values.config.rateLimitByIP | quote }}

  # Circuit breaker
  CIRCUIT_BREAKER_ENABLED: {{ .Values.config.circuitBreakerEnabled | quote }}
  CIRCUIT_BREAKER_THRESHOLD: {{ .Values.config.circuitBreakerThreshold | quote }}
  CIRCUIT_BREAKER_TIMEOUT: {{ .Values.config.circuitBreakerTimeout | quote }}

  # Authentication
  AUTH_ENABLED: {{ .Values.config.authEnabled | quote }}
  AUTH_MODE: {{ .Values.config.authMode | quote }}
  AUTH_SKIP_ENDPOINTS: {{ .Values.config.authSkipEndpoints | quote }}

  # CORS
  CORS_ENABLED: {{ .Values.config.corsEnabled | quote }}
  {{- if .Values.config.corsAllowedOrigins }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | join "," | quote }}
  {{- end }}
  CORS_ALLOWED_METHODS: {{ .Values.config.corsAllowedMethods | quote }}

  # TLS
  TLS_ENABLED: {{ .Values.config.tlsEnabled | quote }}
  {{- if .Values.config.tlsCertFile }}
  TLS_CERT_FILE: {{ .Values.config.tlsCertFile | quote }}
  {{- end }}
  {{- if .Values.config.tlsKeyFile }}
  TLS_KEY_FILE: {{ .Values.config.tlsKeyFile | quote }}
  {{- end }}

  # Metrics
  METRICS_ENABLED: {{ .Values.config.metricsEnabled | quote }}
  METRICS_NAMESPACE: {{ .Values.config.metricsNamespace | quote }}

  # Compression
  COMPRESSION_ENABLED: {{ .Values.config.compressionEnabled | quote }}
  COMPRESSION_MIN_SIZE: {{ .Values.config.compressionMinSize | quote }}

  # Connection pool
  NEO4J_MAX_POOL_SIZE: {{ .Values.config.neo4jMaxPoolSize | quote }}
  NEO4J_ACQUIRE_TIMEOUT_SEC: {{ .Values.config.neo4jAcquireTimeoutSec | quote }}
  NEO4J_MAX_CONN_LIFETIME_SEC: {{ .Values.config.neo4jMaxConnLifetimeSec | quote }}

  # Graceful shutdown
  GRACEFUL_SHUTDOWN_TIMEOUT: {{ .Values.config.gracefulShutdownTimeout | quote }}

  # Scoring parameters
  SCORING_ALPHA: {{ .Values.config.scoringAlpha | quote }}
  SCORING_BETA: {{ .Values.config.scoringBeta | quote }}
  SCORING_GAMMA: {{ .Values.config.scoringGamma | quote }}
  SCORING_DELTA: {{ .Values.config.scoringDelta | quote }}

  # Hidden layer
  HIDDEN_LAYER_ENABLED: {{ .Values.config.hiddenLayerEnabled | quote }}
  HIDDEN_LAYER_CLUSTER_EPS: {{ .Values.config.hiddenLayerClusterEps | quote }}
  HIDDEN_LAYER_MIN_SAMPLES: {{ .Values.config.hiddenLayerMinSamples | quote }}

  # Anomaly detection
  ANOMALY_DETECTION_ENABLED: {{ .Values.config.anomalyDetectionEnabled | quote }}
  ANOMALY_DUPLICATE_THRESHOLD: {{ .Values.config.anomalyDuplicateThreshold | quote }}

  # Plugin system
  PLUGINS_ENABLED: {{ .Values.config.pluginsEnabled | quote }}
