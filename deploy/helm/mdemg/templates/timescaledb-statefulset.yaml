{{- if .Values.timescaledb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mdemg.fullname" . }}-timescaledb
  labels:
    {{- include "mdemg.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-database
spec:
  serviceName: {{ include "mdemg.fullname" . }}-timescaledb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mdemg.name" . }}-timescaledb
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mdemg.name" . }}-timescaledb
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: timescaledb
          image: "{{ .Values.timescaledb.image.repository }}:{{ .Values.timescaledb.image.tag }}"
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "mdemg_metrics"
            - name: POSTGRES_USER
              value: "mdemg"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mdemg.secretName" . }}
                  key: tsdb-password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mdemg", "-d", "mdemg_metrics"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "mdemg", "-d", "mdemg_metrics"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.timescaledb.resources | nindent 12 }}
          volumeMounts:
            - name: tsdb-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: tsdb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.timescaledb.storage }}
{{- end }}
