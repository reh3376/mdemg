<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1200" width="1100" height="1200" role="img" aria-label="How Jiminy Thinks: BEFORE and AFTER phases of the guidance loop">
  <title>How Jiminy Thinks</title>
  <desc>Vertical two-phase loop. Before an action, Jiminy retrieves durable rules and synthesizes a directive. After the action, Jiminy classifies compliance and feeds the outcome to trust score, RSIC, and Grafana.</desc>

  <defs>
    <style>
      .title    { font: 600 20px -apple-system, "Inter", "Segoe UI", Arial, sans-serif; fill: #475569; letter-spacing: 0.08em; text-transform: uppercase; }
      .label    { font: 500 20px -apple-system, "Inter", "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .sublabel { font: 400 16px -apple-system, "Inter", "Segoe UI", Arial, sans-serif; fill: #475569; }
      .edge     { font: italic 400 15px -apple-system, "Inter", "Segoe UI", Arial, sans-serif; fill: #475569; }
      .center   { text-anchor: middle; }
      .start    { text-anchor: start; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1100" height="1200" fill="#ffffff"/>

  <!-- =========== AGENT TOP =========== -->
  <g>
    <rect x="400" y="30" width="300" height="70" rx="35" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <text x="550" y="73" class="label center">Agent decides to act</text>
  </g>

  <!-- flow label -->
  <line x1="550" y1="100" x2="550" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="570" y="130" class="edge start">about to run a tool</text>

  <!-- =========== BEFORE PANEL =========== -->
  <g>
    <rect x="80" y="170" width="940" height="340" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="110" y="200" class="title">1 · BEFORE  —  Get guidance</text>

    <!-- Service: POST /latest -->
    <rect x="400" y="230" width="300" height="60" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="550" y="265" class="label center">POST /v1/jiminy/latest</text>

    <line x1="550" y1="290" x2="550" y2="325" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="570" y="312" class="edge start">query</text>

    <!-- Store: L1 Rules (cylinder-styled) -->
    <g>
      <ellipse cx="550" cy="340" rx="150" ry="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
      <path d="M400,340 L400,380 Q400,392 550,392 Q700,392 700,380 L700,340" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
      <path d="M400,340 Q400,352 550,352 Q700,352 700,340" fill="none" stroke="#6d28d9" stroke-width="2"/>
      <text x="550" y="370" class="label center">L1 Rules  —  durable constraints + corrections</text>
    </g>

    <line x1="550" y1="392" x2="550" y2="425" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="570" y="414" class="edge start">top matching rules</text>

    <!-- Service: Synthesize -->
    <rect x="400" y="430" width="300" height="60" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="550" y="465" class="label center">Synthesize directive</text>
  </g>

  <line x1="550" y1="510" x2="550" y2="555" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="570" y="542" class="edge start">directive back to agent</text>

  <!-- =========== AGENT MIDDLE =========== -->
  <g>
    <rect x="400" y="560" width="300" height="70" rx="35" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <text x="550" y="603" class="label center">Agent acts (or doesn't)</text>
  </g>

  <line x1="550" y1="630" x2="550" y2="685" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="570" y="662" class="edge start">tool executed</text>

  <!-- =========== AFTER PANEL =========== -->
  <g>
    <rect x="80" y="700" width="940" height="320" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="110" y="730" class="title">2 · AFTER  —  Record outcome</text>

    <!-- Service: feedback -->
    <rect x="400" y="760" width="300" height="60" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="550" y="795" class="label center">POST /v1/jiminy/feedback</text>

    <line x1="550" y1="820" x2="550" y2="855" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="570" y="842" class="edge start">classify</text>

    <!-- Gate: verdict (diamond) -->
    <polygon points="550,860 680,895 550,930 420,895" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="550" y="890" class="label center">Verdict</text>
    <text x="550" y="912" class="sublabel center">followed · ignored · partial · contradicted · n/a</text>

    <line x1="550" y1="930" x2="550" y2="965" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Store: constraint_outcomes (cylinder) -->
    <g>
      <ellipse cx="550" cy="975" rx="150" ry="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
      <path d="M400,975 L400,1005 Q400,1017 550,1017 Q700,1017 700,1005 L700,975" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
      <path d="M400,975 Q400,987 550,987 Q700,987 700,975" fill="none" stroke="#6d28d9" stroke-width="2"/>
      <text x="550" y="1002" class="label center">constraint_outcomes</text>
    </g>
  </g>

  <!-- =========== FANOUT: three sinks =========== -->
  <!-- splitter lines -->
  <path d="M550,1017 L550,1055 L200,1055 L200,1095" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M550,1055 L550,1095" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M550,1055 L900,1055 L900,1095" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="1100" width="220" height="60" rx="30" fill="#dcfce7" stroke="#047857" stroke-width="2"/>
  <text x="200" y="1135" class="label center">Trust score (J17)</text>

  <rect x="440" y="1100" width="220" height="60" rx="30" fill="#dcfce7" stroke="#047857" stroke-width="2"/>
  <text x="550" y="1135" class="label center">RSIC loop</text>

  <rect x="790" y="1100" width="220" height="60" rx="30" fill="#dcfce7" stroke="#047857" stroke-width="2"/>
  <text x="900" y="1135" class="label center">Grafana panels</text>

  <!-- =========== LEGEND =========== -->
  <g transform="translate(80, 1180)">
    <rect x="0" y="0" width="30" height="14" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="40" y="12" class="sublabel start">actor</text>
    <rect x="110" y="0" width="30" height="14" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="150" y="12" class="sublabel start">service</text>
    <ellipse cx="235" cy="7" rx="15" ry="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="260" y="12" class="sublabel start">data store</text>
    <polygon points="365,0 380,7 365,14 350,7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="390" y="12" class="sublabel start">decision gate</text>
    <rect x="510" y="0" width="30" height="14" rx="7" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
    <text x="550" y="12" class="sublabel start">sink / downstream consumer</text>
  </g>
</svg>
