# MDEMG Docker Compose — Primary deployment configuration
# Usage: docker compose up -d
# Init:  mdemg init (generates .env with dynamic port assignments)
#
# IMPORTANT: All host ports are dynamically assigned by `mdemg init`.
# The .env file MUST exist with port assignments before running compose.
# Run `mdemg init` first — it scans for free ports and generates .env.

services:
  mdemg:
    image: ghcr.io/reh3376/mdemg:${MDEMG_VERSION:-latest}
    # For local development builds, uncomment the next two lines and comment out image:
    # build:
    #   context: .
    #   dockerfile: deploy/docker/Dockerfile.prod
    restart: unless-stopped
    ports:
      # HOOKSYNC-001: bind loopback by default — the server exposes
      # unauthenticated admin/destructive routes; publishing on 0.0.0.0
      # exposed them off-host. Set MDEMG_BIND_ADDR=0.0.0.0 to opt in to a
      # wide bind (e.g. for remote operators), ideally with AUTH_API_KEYS.
      - "${MDEMG_BIND_ADDR:-127.0.0.1}:${MDEMG_PORT}:9999"
    environment:
      LISTEN_ADDR: ":9999"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      LOG_SKIP_HEALTH: "true"

      # Neo4j (internal Docker network — always bolt://neo4j:7687)
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASS: "${NEO4J_PASS:-testpassword}"
      NEO4J_MAX_POOL_SIZE: "${NEO4J_MAX_POOL_SIZE:-100}"

      # TimescaleDB (internal Docker network — always timescaledb:5432)
      TSDB_HOST: "timescaledb"
      TSDB_PORT: "5432"
      TSDB_USER: "${TSDB_USER:-mdemg}"
      TSDB_PASSWORD: "${TSDB_PASSWORD:-mdemg_metrics}"
      TSDB_DATABASE: "${TSDB_DATABASE:-mdemg_metrics}"
      TSDB_ENABLED: "true"
      TSDB_AUTO_MIGRATE: "true"
      TSDB_OPTIONAL: "true"
      AUTO_MIGRATE: "true"

      # Embedding provider
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-openai}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"

      # Rate limiting
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_RPS: "${RATE_LIMIT_RPS:-100}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-200}"

      # Circuit breaker
      CIRCUIT_BREAKER_ENABLED: "${CIRCUIT_BREAKER_ENABLED:-true}"
      CIRCUIT_BREAKER_THRESHOLD: "${CIRCUIT_BREAKER_THRESHOLD:-5}"
      CIRCUIT_BREAKER_TIMEOUT: "${CIRCUIT_BREAKER_TIMEOUT:-30}"

      # Authentication
      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
      AUTH_MODE: "${AUTH_MODE:-apikey}"
      AUTH_API_KEYS: "${AUTH_API_KEYS:-${MDEMG_API_KEYS}}"

      # Metrics
      METRICS_ENABLED: "${METRICS_ENABLED:-true}"
      METRICS_NAMESPACE: "${METRICS_NAMESPACE:-mdemg}"

      # Neural sidecar (J17 protocol)
      J17_SIDECAR_URL: "${J17_SIDECAR_URL:-http://neural-sidecar:8000}"
      J17_SIDECAR_MODE: "${J17_SIDECAR_MODE:-shadow}"
      J17_SIDECAR_TIMEOUT_MS: "${J17_SIDECAR_TIMEOUT_MS:-1000}"
      J17_SIDECAR_CONFIDENCE_FLOOR: "${J17_SIDECAR_CONFIDENCE_FLOOR:-0.6}"
      J17_SIDECAR_CB_FAILURE_THRESHOLD: "${J17_SIDECAR_CB_FAILURE_THRESHOLD:-3}"
      J17_SIDECAR_CB_TIMEOUT_SEC: "${J17_SIDECAR_CB_TIMEOUT_SEC:-15}"
      J17_NLI_COMPREHENSION_ENABLED: "${J17_NLI_COMPREHENSION_ENABLED:-false}"
      J17_NLI_CALIBRATION_BIAS_THRESHOLD: "${J17_NLI_CALIBRATION_BIAS_THRESHOLD:-0.15}"

      # LLM / Reranker
      # Phase 11.6 (2026-04-30): production cutover. Defaults moved from gpt-5.4-mini cloud
      # to mdemg-llm-v1 (Phase 5 dense, served by llama-server on host:8102 (Phase 13.5 cutover, 2026-05-03)). Containers
      # reach the host via host.docker.internal:8101. Override via .env to switch back to cloud.
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      LLM_MODEL: "${LLM_MODEL:-mdemg-llm-v1}"
      LLM_ENDPOINT: "${LLM_ENDPOINT:-http://host.docker.internal:8102/v1}"
      RERANK_ENABLED: "${RERANK_ENABLED:-true}"
      RERANK_PROVIDER: "${RERANK_PROVIDER:-openai}"
      RERANK_MODEL: "${RERANK_MODEL:-mdemg-llm-v1}"
      RERANK_TOP_N: "${RERANK_TOP_N:-50}"
      RERANK_WEIGHT: "${RERANK_WEIGHT:-0.50}"
      RERANK_TIMEOUT_MS: "${RERANK_TIMEOUT_MS:-60000}"

      # Campaign task activation (set in .env to enable training data collection)
      QUERY_CLASSIFY_ENABLED: "${QUERY_CLASSIFY_ENABLED:-true}"
      # TSDB-CONSUME-001: default-on — feeds the scorer-drift tripwire rules
      RETRIEVAL_AUDIT_ENABLED: "${RETRIEVAL_AUDIT_ENABLED:-true}"
      INTENT_ENABLED: "${INTENT_ENABLED:-false}"
      JIMINY_ENABLED: "${JIMINY_ENABLED:-false}"
      JIMINY_SYNTHESIS_ENABLED: "${JIMINY_SYNTHESIS_ENABLED:-true}"
      JIMINY_SYNTHESIS_PROVIDER: "${JIMINY_SYNTHESIS_PROVIDER:-}"
      JIMINY_SYNTHESIS_MODEL: "${JIMINY_SYNTHESIS_MODEL:-}"
      JIMINY_EVALUATE_ENABLED: "${JIMINY_EVALUATE_ENABLED:-true}"
      JIMINY_EVALUATE_LLM_ENABLED: "${JIMINY_EVALUATE_LLM_ENABLED:-true}"
      JIMINY_EVALUATE_LLM_PROVIDER: "${JIMINY_EVALUATE_LLM_PROVIDER:-}"
      JIMINY_EVALUATE_LLM_MODEL: "${JIMINY_EVALUATE_LLM_MODEL:-}"
      JIMINY_OUTCOME_CLASSIFIER_ENABLED: "${JIMINY_OUTCOME_CLASSIFIER_ENABLED:-true}"
      JIMINY_OUTCOME_LLM_ENABLED: "${JIMINY_OUTCOME_LLM_ENABLED:-true}"
      JIMINY_OUTCOME_SIMILARITY_HIGH: "${JIMINY_OUTCOME_SIMILARITY_HIGH:-0.55}"
      JIMINY_OUTCOME_SIMILARITY_LOW: "${JIMINY_OUTCOME_SIMILARITY_LOW:-0.20}"
      EMERGENCE_ENABLED: "${EMERGENCE_ENABLED:-false}"
      METALEARN_ENABLED: "${METALEARN_ENABLED:-false}"
      LLM_SUMMARY_ENABLED: "${LLM_SUMMARY_ENABLED:-true}"
      CLUSTER_SUMMARY_ENABLED: "${CLUSTER_SUMMARY_ENABLED:-false}"
      CONSULTING_LLM_CONSTRAINTS_ENABLED: "${CONSULTING_LLM_CONSTRAINTS_ENABLED:-true}"
      LLM_INTERACTION_LOGGING: "${LLM_INTERACTION_LOGGING:-true}"

      # Sprint FT-LORA-B guardrail task-name constant (ULTS spec: guardrail_evaluate.ults.json)
      GUARDRAIL_TASK_NAME: "${GUARDRAIL_TASK_NAME:-guardrail.evaluate}"

      # Sprint FT-LORA-E training-infra knobs (consumed by neural/training/train_ft.py)
      ROUTER_AUX_LOSS_COEF: "${ROUTER_AUX_LOSS_COEF:-0.002}"
      LORA_TIER1_RANK: "${LORA_TIER1_RANK:-32}"
      LORA_TIER1_ALPHA: "${LORA_TIER1_ALPHA:-64}"
      LORA_TIER2_RANK: "${LORA_TIER2_RANK:-8}"
      LORA_TIER2_ALPHA: "${LORA_TIER2_ALPHA:-16}"
      LORA_N_EPOCHS_CAP: "${LORA_N_EPOCHS_CAP:-3}"
      LORA_EARLY_STOP_SFT_THRESHOLD: "${LORA_EARLY_STOP_SFT_THRESHOLD:-1.05}"
      LORA_EARLY_STOP_RL_THRESHOLD: "${LORA_EARLY_STOP_RL_THRESHOLD:-0.95}"
      ASYMMETRIC_QUANT_SHARED: "${ASYMMETRIC_QUANT_SHARED:-bf16}"
      ASYMMETRIC_QUANT_ROUTED: "${ASYMMETRIC_QUANT_ROUTED:-mxfp4_moe}"
      ASYMMETRIC_QUANT_ATTN: "${ASYMMETRIC_QUANT_ATTN:-bf16}"

      # Alert dispatcher
      ALERT_ENABLED: "${ALERT_ENABLED:-true}"
      ALERT_COOLDOWN_SEC: "${ALERT_COOLDOWN_SEC:-300}"
      ALERT_MACOS_NOTIFY: "${ALERT_MACOS_NOTIFY:-false}"

      # Health probe
      HEALTH_PROBE_ENABLED: "${HEALTH_PROBE_ENABLED:-true}"
      HEALTH_PROBE_INTERVAL_SEC: "${HEALTH_PROBE_INTERVAL_SEC:-60}"

      # LLM retry
      LLM_RETRY_ENABLED: "${LLM_RETRY_ENABLED:-true}"
      LLM_RETRY_MAX_ATTEMPTS: "${LLM_RETRY_MAX_ATTEMPTS:-5}"
      LLM_RETRY_BASE_DELAY_MS: "${LLM_RETRY_BASE_DELAY_MS:-500}"
      LLM_RETRY_MAX_DELAY_MS: "${LLM_RETRY_MAX_DELAY_MS:-60000}"

      # Task-specific timeouts (decoupled from EMERGENCE_TIMEOUT_MS)
      CONSULTING_CLASSIFY_TIMEOUT_MS: "${CONSULTING_CLASSIFY_TIMEOUT_MS:-15000}"
      RSIC_LLM_REFLECT_TIMEOUT_MS: "${RSIC_LLM_REFLECT_TIMEOUT_MS:-15000}"

      # TSDB writer
      TSDB_WRITER_BUFFER_MAX_SIZE: "${TSDB_WRITER_BUFFER_MAX_SIZE:-1000}"

      # Synergy assessment
      SYNERGY_ASSESSMENT_ENABLED: "${SYNERGY_ASSESSMENT_ENABLED:-true}"
      SYNERGY_CLAUDE_MD_PATH: "${SYNERGY_CLAUDE_MD_PATH:-}"
      SYNERGY_MEMORY_MD_PATH: "${SYNERGY_MEMORY_MD_PATH:-}"

      # RSIC overall-health weights (DH-005). Hybrid reliability × user-impact
      # priors. Formula normalises — values need not sum to 1.0. Zero disables
      # a dimension; negative values are logged as warnings and replaced with
      # the default. See docs/features/rsic-feedback-loop.md for derivation.
      RSIC_HEALTH_WEIGHT_RETRIEVAL: "${RSIC_HEALTH_WEIGHT_RETRIEVAL:-0.08}"
      RSIC_HEALTH_WEIGHT_MEMORY: "${RSIC_HEALTH_WEIGHT_MEMORY:-0.15}"
      RSIC_HEALTH_WEIGHT_EDGE: "${RSIC_HEALTH_WEIGHT_EDGE:-0.15}"
      RSIC_HEALTH_WEIGHT_TASK: "${RSIC_HEALTH_WEIGHT_TASK:-0.20}"
      RSIC_HEALTH_WEIGHT_GUIDANCE: "${RSIC_HEALTH_WEIGHT_GUIDANCE:-0.17}"
      RSIC_HEALTH_WEIGHT_PROTOCOL: "${RSIC_HEALTH_WEIGHT_PROTOCOL:-0.20}"
      RSIC_HEALTH_WEIGHT_SYNERGY: "${RSIC_HEALTH_WEIGHT_SYNERGY:-0.05}"

      # Graceful shutdown
      GRACEFUL_SHUTDOWN_TIMEOUT: "${GRACEFUL_SHUTDOWN_TIMEOUT:-30}"
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9999/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      neo4j:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - mdemg-net

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASS:-testpassword}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: "${NEO4J_PAGECACHE:-512M}"
      NEO4J_dbms_memory_heap_initial__size: "${NEO4J_HEAP_INIT:-256M}"
      NEO4J_dbms_memory_heap_max__size: "${NEO4J_HEAP_MAX:-512M}"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASS:-testpassword} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mdemg-net

  timescaledb:
    image: timescale/timescaledb:2.25.1-pg16
    restart: unless-stopped
    ports:
      - "${TSDB_HOST_PORT}:5432"
    environment:
      POSTGRES_DB: "${TSDB_DATABASE:-mdemg_metrics}"
      POSTGRES_USER: "${TSDB_USER:-mdemg}"
      POSTGRES_PASSWORD: "${TSDB_PASSWORD:-mdemg_metrics}"
    volumes:
      - tsdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TSDB_USER:-mdemg} -d ${TSDB_DATABASE:-mdemg_metrics}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mdemg-net

  neural-sidecar:
    image: ghcr.io/reh3376/mdemg-neural-sidecar:${MDEMG_VERSION:-latest}
    # For local development builds, uncomment the next line and comment out image:
    # build: ./neural
    restart: unless-stopped
    ports:
      - "${NEURAL_PORT}:8000"
    environment:
      NEURAL_RERANK_MODEL: ${NEURAL_RERANK_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      NEURAL_NLI_MODEL: ${NEURAL_NLI_MODEL:-cross-encoder/nli-MiniLM2-L6-H768}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mdemg-net

  grafana:
    image: grafana/grafana:10.2.2
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/dashboards/mdemg-overview.json"
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      GF_INSTALL_PLUGINS: "kniepdennis-neo4j-datasource,hamedkarbasi93-nodegraphapi-datasource"
      TSDB_PASSWORD: "${TSDB_PASSWORD:-mdemg_metrics}"
      MDEMG_GRAFANA_ALERT_WEBHOOK_URL: "${MDEMG_GRAFANA_ALERT_WEBHOOK_URL:-http://mdemg:9999/v1/alerts/grafana}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/docker/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./deploy/docker/grafana/provisioning/notifiers:/etc/grafana/provisioning/notifiers:ro
      - ./deploy/docker/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - timescaledb
    networks:
      - mdemg-net

volumes:
  neo4j_data:
  neo4j_logs:
  tsdb_data:
  grafana_data:

networks:
  mdemg-net:
    driver: bridge
