[project]
name = "neural-sidecar"
version = "0.1.0"
description = "MDEMG Neural Sidecar — cross-encoder re-ranking and NLI classification"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sentence-transformers>=3.0.0",
    "pydantic-settings>=2.0.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
mdemg-neural-train = "neural_sidecar.train:main"
mdemg-neural-train-protocol = "neural_sidecar.train_protocol:main"
mdemg-neural-evaluate = "neural_sidecar.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.mypy]
python_version = "3.10"
strict = true
