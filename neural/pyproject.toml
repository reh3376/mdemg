[project]
name = "neural-sidecar"
version = "0.1.0"
description = "MDEMG Neural Sidecar — cross-encoder re-ranking and NLI classification"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sentence-transformers>=5.6.0",  # CVE-2026-68770 CRITICAL (RCE via security-control bypass; fixed in 5.6.0)
    "fsspec>=2026.6.0",  # CVE-2026-104851 HIGH (RCE via crafted input; fixed in 2026.6.0); transitive via huggingface-hub + torch, forced direct
    "certifi>=2026.10.19",  # GHSA-6q48-6c7w-9gw2 CRITICAL (bundled emSign root CAs with compromised private key; fixed in 2026.10.19); transitive via httpx/requests/huggingface-hub, forced direct
    "filelock>=4.2.1",  # CVE-2026-112940 HIGH (arbitrary file overwrite via insecure database file reopening; fixed in 4.2.1); transitive via huggingface-hub + torch, forced direct
    "pydantic-settings>=2.14.2",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
training = [
    "jsonschema>=4.20.0",
    "cuid2>=2.0.0",
    # BENCH-SIDECAR-APPLY-001: run_benchmark --apply-tsdb + UVTS runner TSDB
    # persistence (psycopg v3; soft-import in code, declared here because the
    # training extra is where benchmark tooling deps live).
    "psycopg[binary]>=3.1",
    "gguf>=0.10",
]
lora = [
    "mlx-lm>=0.20.0",
]

[project.scripts]
mdemg-neural-train = "neural_sidecar.train:main"
mdemg-neural-train-protocol = "neural_sidecar.train_protocol:main"
mdemg-neural-evaluate = "neural_sidecar.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
strict = true
